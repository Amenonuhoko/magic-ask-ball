<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ask Ball" />
  <title>Magic Ask Ball</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div id="level-indicator" class="level-indicator">
      <svg viewBox="0 0 100 100" width="60" height="60">
        <circle cx="50" cy="50" r="46" class="level-ring" />
        <line x1="50" y1="6" x2="50" y2="14" class="level-tick" />
        <line x1="50" y1="94" x2="50" y2="86" class="level-tick" />
        <line x1="6" y1="50" x2="14" y2="50" class="level-tick" />
        <line x1="94" y1="50" x2="86" y2="50" class="level-tick" />
        <circle id="level-dot" cx="50" cy="50" r="5" class="level-dot" />
      </svg>
      <span class="level-label">Level</span>
    </div>
    <div id="stage" class="stage">
      <svg id="escape-ring" class="escape-ring" viewBox="0 0 100 100" hidden>
        <circle cx="50" cy="50" r="47" class="escape-ring-track" pathLength="100" />
        <circle id="escape-ring-progress" cx="50" cy="50" r="47" class="escape-ring-progress"
          pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" />
      </svg>
      <canvas id="dice-canvas" class="dice-canvas"></canvas>
    </div>
    <p id="dice-answer" class="dice-answer">Shake to roll</p>
    <p id="stop-indicator" class="stop-indicator" hidden></p>
    <p id="status" class="status">Loading…</p>
    <button id="enable-motion" class="enable-motion" hidden>Enable sensors</button>
  </main>
  <button id="recenter-btn" class="recenter-btn" type="button">Recenter</button>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
