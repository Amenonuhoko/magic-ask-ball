<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ask Ball" />
  <title>Magic Ask Ball</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div id="stage" class="stage">
      <div id="shape" class="shape"></div>
      <p id="info-text" class="info-text" hidden></p>
    </div>
    <p id="status" class="status">Tilt your phone to change the shape</p>
    <button id="enable-motion" class="enable-motion" hidden>Enable orientation</button>
    <div id="calibration" class="calibration" hidden>
      <div id="calibration-readout" class="calibration-readout"></div>
      <label class="range-control">
        Range <span id="range-value">45°</span>
        <input id="range-slider" type="range" min="10" max="70" value="45" />
      </label>
      <button id="calibrate-btn" class="calibrate-btn" type="button">
        Calibrate (tap, then tilt to extremes)
      </button>
    </div>
  </main>
  <nav id="mode-carousel" class="carousel">
    <button class="mode-btn mode-1" data-mode="info" type="button">Orientation</button>
    <button class="mode-btn mode-2 active" data-mode="default" type="button">Default</button>
    <button class="mode-btn mode-3" data-mode="ball" type="button">Ball</button>
  </nav>
  <script src="app.js"></script>
</body>
</html>
