<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ask Ball" />
  <title>Magic Ask Ball</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div id="stage" class="stage">
      <!-- Level indicator, drawn BEHIND the die on purpose: a soft glow
           roughly the die's own size, centered on it and only shifting a
           little with tilt, so at rest it's fully covered by the die and
           only peeks out past its edges as you tilt — you can always see
           the die, the glow is just a subtle hint of which way it's
           leaning. -->
      <svg id="level-light-layer" class="level-light-layer" viewBox="0 0 100 100">
        <defs>
          <radialGradient id="level-light-gradient">
            <stop offset="0%" stop-color="#d4af37" stop-opacity="0.5" />
            <stop offset="60%" stop-color="#d4af37" stop-opacity="0.22" />
            <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
          </radialGradient>
        </defs>
        <circle id="level-light" cx="50" cy="50" r="40" class="level-light" />
      </svg>
      <!-- Drifting mist, also BEHIND the die like the level light above —
           same reasoning: it enriches the space around/behind the die
           without ever covering it up. -->
      <div class="mist-layer" aria-hidden="true">
        <div class="mist-blob mist-blob-a"></div>
        <div class="mist-blob mist-blob-b"></div>
        <div class="mist-blob mist-blob-c"></div>
      </div>
      <canvas id="dice-canvas" class="dice-canvas"></canvas>
      <svg id="viewfinder" class="viewfinder" viewBox="0 0 100 100">
        <defs>
          <!-- Donut/annulus, not a filled disc. IMPORTANT: this must be ONE
               <path> with two subpaths (outer + inner circle) and
               clip-rule="evenodd" on that single element — sibling shapes
               inside a clipPath are always unioned by the SVG spec
               regardless of each one's own clip-rule, so two separate
               <circle> elements (even both marked evenodd) just produce
               the outer disc with no hole at all. Verified by rendering
               both forms and sampling actual pixels: two circles filled
               everywhere out to r=47 with no hole; one path with two
               subpaths genuinely leaves the center AND the far outside
               unfilled, filling only the ring between r=37 and r=47. -->
          <clipPath id="escape-fill-clip">
            <path
              clip-rule="evenodd"
              d="M 97 50 A 47 47 0 1 0 3 50 A 47 47 0 1 0 97 50 Z
                 M 87 50 A 37 37 0 1 0 13 50 A 37 37 0 1 0 87 50 Z"
            />
          </clipPath>
        </defs>

        <!-- PREVIEW ONLY: "Bound Vessel" from the sigil concepts (see
             https://claude.ai/code/artifact/33c37e50-a122-48aa-8380-16731180c044),
             scaled 0.5x from its original 200x200 drawing into this
             viewfinder's 0-100 space and superimposed very faintly on the
             die. Easy to remove or swap for a different concept once a
             direction is picked. Beyond the original design: an octagon
             connecting the 8 outer marker tips (each tip already sits
             exactly on the r=39 ring, so it's an exact inscribed
             octagon), a mid dashed ring at r=20, and 4 diagonal ticks
             (NE/SE/SW/NW) matching the original's N/S/E/W ticks -- added
             detail once the mark was scaled down, so it doesn't read as
             emptier at the smaller size. Only responds to the gold
             (affirmative) glow -- see .sigil-bound-vessel in style.css.
             Placed FIRST among the viewfinder's children (right after
             <defs>, before the brackets/escape-ring/status-icon) so it
             paints first and sits behind all of them -- SVG paint order
             follows document order, so being earliest here is what makes
             it the backmost layer within the viewfinder, not a z-index. -->
        <g class="sigil-preview sigil-bound-vessel">
          <circle cx="50" cy="50" r="45" stroke-dasharray="1 1.75" />
          <circle cx="50" cy="50" r="39" />
          <path d="M89,50 L77.6,77.6 L50,89 L22.4,77.6 L11,50 L22.4,22.4 L50,11 L77.6,22.4 Z" />
          <circle cx="50" cy="50" r="32" />
          <path d="M89,50 L85.5,52 L82,50 L85.5,48 Z" />
          <path d="M77.6,77.6 L73.7,76.5 L72.6,72.6 L76.5,73.7 Z" />
          <path d="M50,89 L48,85.5 L50,82 L52,85.5 Z" />
          <path d="M22.4,77.6 L23.5,73.7 L27.4,72.6 L26.3,76.5 Z" />
          <path d="M11,50 L14.5,48 L18,50 L14.5,52 Z" />
          <path d="M22.4,22.4 L26.3,23.5 L27.4,27.4 L23.5,26.3 Z" />
          <path d="M50,11 L52,14.5 L50,18 L48,14.5 Z" />
          <path d="M77.6,22.4 L76.5,26.3 L72.6,27.4 L73.7,23.5 Z" />
          <circle cx="50" cy="50" r="20" stroke-dasharray="0.6 1.2" />
          <circle cx="50" cy="50" r="8" />
          <circle cx="50" cy="50" r="2.5" />
          <line x1="58" y1="50" x2="61" y2="50" />
          <line x1="50" y1="58" x2="50" y2="61" />
          <line x1="42" y1="50" x2="39" y2="50" />
          <line x1="50" y1="42" x2="50" y2="39" />
          <line x1="55.66" y1="44.34" x2="57.78" y2="42.22" />
          <line x1="55.66" y1="55.66" x2="57.78" y2="57.78" />
          <line x1="44.34" y1="55.66" x2="42.22" y2="57.78" />
          <line x1="44.34" y1="44.34" x2="42.22" y2="42.22" />
        </g>

        <!-- "Seed Ward" (design #1 from the same moodboard), superimposed
             alongside Bound Vessel rather than replacing it -- a classic
             flower-of-life: 7 circles of equal radius, one centered and 6
             placed around it at a distance equal to their own radius, in a
             hexagonal ring, plus two outer boundary rings. Scaled 0.5x from
             its original 200x200 drawing into this 0-100 space the same way
             Bound Vessel was (new = 50 + (old-100)*0.5). A separate <g> (not
             nested in Bound Vessel's) so it can carry its own glow: this is
             the ONLY one of the two that responds to the red (negative)
             glow -- see .sigil-seed-ward in style.css. Also placed before
             the brackets, same reasoning as Bound Vessel above. -->
        <g class="sigil-preview sigil-seed-ward">
          <circle cx="50" cy="50" r="46" />
          <circle cx="50" cy="50" r="44" />
          <circle cx="50" cy="50" r="19" />
          <circle cx="69" cy="50" r="19" />
          <circle cx="59.5" cy="66.45" r="19" />
          <circle cx="40.5" cy="66.45" r="19" />
          <circle cx="31" cy="50" r="19" />
          <circle cx="40.5" cy="33.55" r="19" />
          <circle cx="59.5" cy="33.55" r="19" />
          <circle cx="50" cy="50" r="1" />
        </g>

        <!-- corner brackets: frame the die like a camera viewfinder, and
             double as the lock indicator — dim grey by default (locked,
             can't roll), gradually turning solid gold and glowing while
             held down (armed to roll, see .is-held/pointerHeld in app.js),
             a quieter gold while a result is revealed and frozen (see
             .is-frozen). No separate icon. -->
        <path class="vf-bracket" d="M 4 16 L 4 4 L 16 4" />
        <path class="vf-bracket" d="M 84 4 L 96 4 L 96 16" />
        <path class="vf-bracket" d="M 96 84 L 96 96 L 84 96" />
        <path class="vf-bracket" d="M 16 96 L 4 96 L 4 84" />

        <!-- very subtle readout of tilt since the die came to rest; fills
             vertically like a rising liquid level, but clipped to a donut
             (see escape-fill-clip above) so it only ever forms a ring
             hugging the die's edge, purely informational -->
        <circle cx="50" cy="50" r="47" class="escape-ring-track" />
        <rect id="escape-ring-fill" class="escape-ring-fill" x="0" y="100" width="100" height="0"
          clip-path="url(#escape-fill-clip)" />

        <!-- how the current result was revealed: only ever the "paused by
             holding still" glyph now, since a plain tap no longer reveals
             on its own -->
        <g id="status-icon-pause" class="status-icon" hidden>
          <rect x="46" y="84" width="2.5" height="9" rx="1" class="vf-icon-fill" />
          <rect x="51.5" y="84" width="2.5" height="9" rx="1" class="vf-icon-fill" />
        </g>
      </svg>
    </div>
    <p id="dice-answer" class="dice-answer">Shake to roll</p>
    <p id="status" class="status">Loading…</p>
    <button id="enable-motion" class="enable-motion" hidden>Enable sensors</button>
  </main>
  <button id="settings-toggle" class="settings-toggle" type="button" aria-label="Settings" title="Settings">⚙</button>
  <div id="settings-panel" class="settings-panel" hidden>
    <button id="recenter-btn" class="settings-btn settings-btn-primary" type="button">⌖ Recenter</button>
    <div class="settings-divider"></div>
    <div class="settings-section-label">Motion calibration</div>
    <div id="debug-live" class="debug-live">—</div>
    <div class="debug-actions">
      <button id="debug-record-btn" class="debug-btn" type="button">● Record</button>
      <button id="debug-copy-btn" class="debug-btn" type="button" hidden>Copy data</button>
    </div>
    <div id="debug-summary" class="debug-summary">
      Records raw motion data while you shake normally, so real numbers can
      replace guesses. Tap Record, shake a few times like you normally
      would, tap Stop, then Copy and paste the result into the chat.
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
