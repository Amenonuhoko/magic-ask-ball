<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ask Ball" />
  <title>Magic Ask Ball</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div id="stage" class="stage">
      <canvas id="dice-canvas" class="dice-canvas"></canvas>
    </div>
    <p id="dice-answer" class="dice-answer">Shake to roll</p>
    <p id="status" class="status">Loading…</p>
    <button id="enable-motion" class="enable-motion" hidden>Enable sensors</button>
  </main>
  <button id="recenter-btn" class="recenter-btn" type="button">Recenter</button>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
