<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ask Ball" />
  <title>Magic Ask Ball</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div id="stage" class="stage">
      <canvas id="dice-canvas" class="dice-canvas"></canvas>
      <svg id="viewfinder" class="viewfinder" viewBox="0 0 100 100">
        <defs>
          <clipPath id="escape-fill-clip">
            <circle cx="50" cy="50" r="47" />
          </clipPath>
        </defs>

        <!-- corner brackets: frame the die like a camera viewfinder; turn
             gold while a result is locked in (see .is-frozen) -->
        <path class="vf-bracket" d="M 4 16 L 4 4 L 16 4" />
        <path class="vf-bracket" d="M 84 4 L 96 4 L 96 16" />
        <path class="vf-bracket" d="M 96 84 L 96 96 L 84 96" />
        <path class="vf-bracket" d="M 16 96 L 4 96 L 4 84" />

        <!-- very subtle readout of tilt since the die came to rest; fills
             vertically, purely informational -->
        <circle cx="50" cy="50" r="47" class="escape-ring-track" />
        <rect id="escape-ring-fill" class="escape-ring-fill" x="0" y="100" width="100" height="0"
          clip-path="url(#escape-fill-clip)" />

        <!-- crosshair with a gap at center -->
        <line x1="50" y1="40" x2="50" y2="46" class="vf-crosshair" />
        <line x1="50" y1="54" x2="50" y2="60" class="vf-crosshair" />
        <line x1="40" y1="50" x2="46" y2="50" class="vf-crosshair" />
        <line x1="54" y1="50" x2="60" y2="50" class="vf-crosshair" />

        <!-- level reticle: drifts off-center with tilt, recenters on every
             pause (tap or hands-free stillness) -->
        <circle id="reticle-dot" cx="50" cy="50" r="3.5" class="reticle-dot" />

        <!-- how the current result was revealed -->
        <g id="status-icon-tap" class="status-icon" hidden>
          <circle cx="50" cy="88" r="3" class="vf-icon-fill" />
          <circle cx="50" cy="88" r="7" class="vf-icon-ring" />
        </g>
        <g id="status-icon-pause" class="status-icon" hidden>
          <rect x="46" y="84" width="2.5" height="9" rx="1" class="vf-icon-fill" />
          <rect x="51.5" y="84" width="2.5" height="9" rx="1" class="vf-icon-fill" />
        </g>
      </svg>
    </div>
    <p id="dice-answer" class="dice-answer">Shake to roll</p>
    <p id="status" class="status">Loading…</p>
    <button id="enable-motion" class="enable-motion" hidden>Enable sensors</button>
  </main>
  <button id="recenter-btn" class="recenter-btn" type="button" aria-label="Recenter" title="Recenter">⌖</button>
  <button id="debug-toggle" class="debug-toggle" type="button">⚙</button>
  <div id="debug-panel" class="debug-panel" hidden>
    <div id="debug-live" class="debug-live">—</div>
    <div class="debug-actions">
      <button id="debug-record-btn" class="debug-btn" type="button">● Record</button>
      <button id="debug-copy-btn" class="debug-btn" type="button" hidden>Copy data</button>
    </div>
    <div id="debug-summary" class="debug-summary">
      Records raw motion data while you shake normally, so real numbers can
      replace guesses. Tap Record, shake a few times like you normally
      would, tap Stop, then Copy and paste the result into the chat.
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
